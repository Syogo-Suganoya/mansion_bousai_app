name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  # 手動実行（Actionsタブの Run workflow）でもデプロイできるようにしておく
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # GitHubのDeployments(Environments)に実行履歴と公開URLが記録される
    environment:
      name: production
      url: https://mansion-bousai.tokyo-odh-039.workers.dev/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx opennextjs-cloudflare build

      # デプロイ先アカウント(account_id)とHyperdriveバインディングは wrangler.jsonc 側の設定を使う
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
